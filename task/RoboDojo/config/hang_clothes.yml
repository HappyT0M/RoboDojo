Garment:
  -
    common:
      relative_plane: "Table"
      rotate_rand: false
      qpos: [1, 0, 0, 0]
    category:
      - name: "Top_Long"
        index: [1, 4, 6, 7, 9, 11]
    select_mode:
      nums: 1
      mode: "allow_duplicate"
      label: ["target"]

Geometry:
  -
    common:
      relative_plane: "Table"
      rotate_rand: false
      qpos: [1, 0, 0, 0]
    category:
      - name: "garment_rack"
        index: [0]
    select_mode:
      nums: 1
      mode: "same"
      label: ["rack"]

GarmentTask:
  kind: "hang"
  garment_label: "target"
  target_label: "rack"
  bar_height: 0.255
  bar_band: 0.045
  bar_height_tolerance: 0.12
  side_margin: 0.045
  minimum_height_above_table: 0.06
  minimum_side_fraction: 0.07
  minimum_bar_fraction: 0.012
  table_height: 0.765
  stable_steps: 15
